evidence_spans:
- The most noticeable distinction is `.mod` group presence where individual modalities are stored
- The currently existing solutions for multi-omics data (Seurat, MultiAssayExperiment) are confined to the R programming language ecosystem
- Seurat begins with dimensionality reduction methods such as PCA
- In CHAI, we used Louvain and SLM.
- We calculated the DEGs by running the FindAllMarkers function in Seurat
- Normalization of proteome data is achieved by replicating the normalization function of Seurat (v5) using Python
- library(Seurat)

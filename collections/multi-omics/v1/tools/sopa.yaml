evidence_spans:
- We introduce Sopa ( https://github.com/gustaveroussy/sopa ), a technology-invariant, memory-efficient pipeline
- When installing `sopa` as written in our [getting-started guidelines]
- git clone https://github.com/prism-oncology/sopa.git
- use directly `sopa` as a Python package for full flexibility and customization
- Sopa comes in four different flavours, each corresponding to a different use case
- We introduce Sopa ( https://github.com/gustaveroussy/sopa ), a technology-invariant, memory-efficient pipeline with a unified visualizer for all image-based spatial omics.
- Sopa allows the conversion to the Xenium Explorer.
- Internally, it uses `aggregate_channels`, `count_transcripts`, and/or `aggregate_bins`

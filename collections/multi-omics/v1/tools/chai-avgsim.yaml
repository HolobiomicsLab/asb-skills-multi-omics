evidence_spans:
- For CHAI-AvgSim, we calculate an average of all the binary matrices from the different clustering algorithms.
- Once the Average Similarity matrix is computed, we use Spectral Clustering to determine the final cell clusters
- We decided to use CHAI-AvgSim for this analysis, as it demonstrated better consistency across dataset conditions than CHAI-SNF in our benchmarking.

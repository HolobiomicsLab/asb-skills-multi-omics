name: Domain content gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  released-collections:
    name: ${{ matrix.collection.collection_path }}
    strategy:
      fail-fast: false
      matrix:
        collection:
            - domain: multi-omics
              collection_path: collections/multi-omics/v1
              receipts_path: "receipts/dd3209129626"
    # Pin the tooling commit recorded in collections.yaml for the release.
    # Bump this full commit SHA deliberately when adopting newer gate tooling.
    uses: HolobiomicsLab/asb-skill-collections/.github/workflows/domain-gates.yml@7bf0052639ea55ef0b63ae05a816261e19f1e06e
    with:
      domain: ${{ matrix.collection.domain }}
      collection_path: ${{ matrix.collection.collection_path }}
      receipts_path: ${{ matrix.collection.receipts_path }}
      strict: true
      edam_strict: true
